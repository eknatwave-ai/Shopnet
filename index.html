<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shopnet</title>

    <!-- Подключаем скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script>
        async function initTelegramApp() {
            // Ждем загрузки и инициализируем API
            window.Telegram.WebApp.ready();

            // Шаг 1: Сразу вытягиваем шторку на максимум вверх
            window.Telegram.WebApp.expand();

            // Шаг 2: Пробуем принудительно запустить Fullscreen (для переходов из «О себе»)
            if (window.Telegram.WebApp.requestFullscreen) {
                try {
                    await window.Telegram.WebApp.requestFullscreen();
                } catch (error) {
                    console.log("Режим полного экрана ожидает действия пользователя");
                }
            }
        }

        // Запуск логики сразу после построения DOM-дерева
        window.addEventListener('DOMContentLoaded', initTelegramApp);
    </script>

    <style>
        /* Общий фон и центрирование */
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #0c0d12;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== КОНТЕЙНЕР (фон без клетчатки) ===== */
        .chat-container {
            position: relative;
            width: 401px;
            height: 751px;
            background-color: #1e1f26;
            border-radius: 0;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            overflow: visible;
        }

        /* ===== ПАНЕЛЬ НАВИГАЦИИ (НИЖНЯЯ) ===== */
        .nav-panel {
            position: absolute;
            bottom: 15px;
            left: 10px;
            right: 90px;
            display: flex;
            background-color: #2b303c;
            border-radius: 40px;
            padding: 6px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            align-items: center;
            z-index: 10;
            overflow: visible;
            box-sizing: border-box;
            justify-content: space-between;
            height: 77px;
        }

        /* Скользящая подложка - симметричная */
        .nav-slider {
            position: absolute;
            top: 6px;
            height: 65px;
            background-color: #383e4c;
            border-radius: 35px;
            z-index: -1;
            will-change: transform, width, opacity;
            transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1),
                        width 0.28s cubic-bezier(0.25, 1, 0.5, 1),
                        opacity 0.25s ease;
            pointer-events: none;
            opacity: 1;
        }

        /* Элементы меню */
        .nav-item {
            position: relative;
            display: block;
            flex: 1;
            height: 65px;
            color: #8fa2b2;
            text-decoration: none;
            cursor: pointer;
            border-radius: 35px;
            user-select: none;
            transition: color 0.2s ease;
            box-sizing: border-box;
            min-width: 0;
            z-index: 1;
        }

        /* ===== НОВАЯ КРУГЛАЯ ПАНЕЛЬ (MAJOR BUTTON) ===== */
        .profile-button {
            position: absolute;
            bottom: 15px;
            right: 10px;
            width: 77px;
            height: 77px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            user-select: none;
            box-sizing: border-box;
            padding: 0;
            background-color: #1a1a1a;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        /* Сама круглая градиентная кнопка внутри контейнера */
        .major-coin-button {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(to bottom, #ffd175 0%, #ff9743 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s ease, filter 0.2s ease;
            box-shadow:
                inset 0 4px 8px rgba(255, 255, 255, 0.4),
                inset 0 -4px 8px rgba(0, 0, 0, 0.2);
        }

        /* ===== СИНИЙ ОБОДОК (МГНОВЕННО, КАК В TELEGRAM) ===== */
        .profile-button.active .major-coin-button {
            box-shadow:
                0 0 0 3px #1a1a1a,
                0 0 0 6px #2f80ed,
                inset 0 4px 8px rgba(255, 255, 255, 0.4),
                inset 0 -4px 8px rgba(0, 0, 0, 0.2);
        }

        .major-coin-button:active {
            transform: scale(0.96);
            filter: brightness(0.95);
        }

        /* Белый символ "I" по центру - СТИЛЬ iPHONE */
        .major-coin-symbol {
            color: #ffffff;
            /* Приоритет системным шрифтам Apple для скругленных засечек */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Helvetica Neue", Arial, sans-serif;
            font-size: 34px;
            font-weight: 700;
            line-height: 1;
            /* Оптическая компенсация: буква I визуально кажется выше центра из-за отсутствия нижних выносных элементов */
            margin-top: 2px;
            text-shadow: 0px 1px 2px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Иконки внутри панели */
        .nav-item svg {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 24px;
            display: block;
            will-change: fill, stroke;
        }

        /* Специфические размеры иконок */
        .nav-item svg.home-icon {
            width: 28px;
            height: 28px;
            top: 7px;
        }
        .nav-item .cart-icon {
            width: 28px;
            height: 28px;
            top: 6px;
        }
        .nav-item .catalog-icon {
            width: 28px;
            height: 28px;
            top: 6px;
        }
        .nav-item svg.chat-icon {
            width: 28px;
            height: 28px;
            top: 6px;
        }

        /* Текст под иконкой */
        .nav-item span {
            position: absolute;
            bottom: 13px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 11px;
            font-weight: 500;
            line-height: 1;
            display: block;
            white-space: nowrap;
        }

        /* ===== ВСЕ АКТИВНЫЕ ВКЛАДКИ СИНИЕ ===== */
        .nav-item.active {
            color: #2f80ed;
        }

        /* Home иконка */
        .nav-item:not(.active) svg.home-icon {
            color: #8fa2b2;
        }
        .nav-item:not(.active) svg.home-icon path {
            fill: #8fa2b2;
        }
        .nav-item.active svg.home-icon {
            color: #2f80ed;
        }
        .nav-item.active svg.home-icon path {
            fill: #2f80ed;
        }

        /* Cart иконка */
        .nav-item .cart-icon {
            color: #8fa2b2;
        }
        .nav-item .cart-icon path {
            stroke: #8fa2b2;
        }
        .nav-item.active .cart-icon {
            color: #2f80ed;
        }
        .nav-item.active .cart-icon path {
            stroke: #2f80ed;
        }

        /* Favorites иконка */
        .nav-item .catalog-icon {
            color: #8fa2b2;
        }
        .nav-item.active .catalog-icon {
            color: #2f80ed;
        }

        /* Messages иконка */
        .nav-item:not(.active) svg.chat-icon {
            color: #8fa2b2;
        }
        .nav-item.active svg.chat-icon {
            color: #2f80ed;
        }
    </style>
</head>

    <!-- ========== СКРИПТ НАВИГАЦИИ ========== -->
    <script>
        const slider = document.getElementById('slider');
        let isProfileActive = false;

        function setActiveTab(element) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });

            // Убираем активный класс у Profile - мгновенно
            document.getElementById('profileButton').classList.remove('active');

            element.classList.add('active');

            const parent = element.parentElement;
            const parentRect = parent.getBoundingClientRect();
            const elementRect = element.getBoundingClientRect();

            const offsetLeft = elementRect.left - parentRect.left;
            const padding = 6;

            const elementWidth = Math.round(elementRect.width);
            const sliderWidth = elementWidth - 4;
            const sliderOffset = Math.round(offsetLeft - padding + 2);

            if (isProfileActive) {
                slider.style.transition = 'none';
                slider.style.width = `${sliderWidth}px`;
                slider.style.transform = `translateX(${sliderOffset}px)`;

                void slider.offsetHeight;

                slider.style.transition = 'opacity 0.25s ease';
                slider.style.opacity = '1';
                isProfileActive = false;
            } else {
                slider.style.transition = 'transform 0.28s cubic-bezier(0.25, 1, 0.5, 1), width 0.28s cubic-bezier(0.25, 1, 0.5, 1)';
                slider.style.width = `${sliderWidth}px`;
                slider.style.transform = `translateX(${sliderOffset}px)`;
                slider.style.opacity = '1';
            }
        }

        function setActiveProfile(element) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });

            slider.style.transition = 'opacity 0.25s ease';
            slider.style.opacity = '0';
            isProfileActive = true;

            // Мгновенно добавляем синий ободок (без анимации)
            element.classList.add('active');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const defaultTab = document.getElementById('defaultTab');
            if (defaultTab) {
                setActiveTab(defaultTab);
            }
        });
    </script>

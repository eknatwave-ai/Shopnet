<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shopnet · Только верх без обводок</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #0c0d12;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        .chat-container {
            position: relative;
            width: 401px;
            height: 751px;
            background-color: #1e1f26;
            border-radius: 0;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .floating-panel {
            background-color: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border-radius: 0px;
            padding: 4px;
            user-select: none;
            z-index: 25;
            display: none;
            box-shadow: none;
            height: 44px;
            align-items: center;
            position: relative;
            isolation: isolate;
            border: none;
            outline: none;
        }

        .floating-panel::before {
            display: none;
        }

        .floating-panel.visible {
            display: flex;
        }

        .edit-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            min-width: 70px;
            justify-content: center;
        }

        /* === КНОПКА «Изм.» — С БЛИКОМ === */
        .btn-edit {
            background-color: #2b303c;
            color: #ffffff;
            border: none;
            font-size: 15px;
            font-weight: 400;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Helvetica Neue", Arial, sans-serif;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            isolation: isolate;
        }

        .btn-edit::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 1.5px;
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.35) 0%,
                rgba(255, 255, 255, 0) 25%,
                rgba(255, 255, 255, 0) 75%,
                rgba(255, 255, 255, 0.25) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 5;
        }

        /* === ПАНЕЛЬ «Shopnet» — С БЛИКОМ === */
        .title-panel {
            position: absolute;
            top: 10px; /* ТОЧНО НА ОДНОЙ ВЫСОТЕ С КНОПКОЙ ИЗМ */
            left: 50%;
            transform: translateX(-50%);
            padding: 4px 16px;
            justify-content: center;
            background-color: #2b303c;
            border-radius: 20px;
            height: 36px;
            display: flex;
            align-items: center;
            isolation: isolate;
        }

        .title-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 1.5px;
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.35) 0%,
                rgba(255, 255, 255, 0) 25%,
                rgba(255, 255, 255, 0) 75%,
                rgba(255, 255, 255, 0.25) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 5;
        }

        .header-title {
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.5px;
            white-space: nowrap;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Helvetica Neue", Arial, sans-serif;
            line-height: 1;
        }

        .buttons-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            min-width: 80px;
            justify-content: center;
        }

        /* === БЛОК ИКОНОК — С БЛИКОМ === */
        .right-capsule {
            display: flex;
            align-items: center;
            background-color: #2b303c;
            border-radius: 20px;
            padding: 2px;
            height: 36px;
            position: relative;
            isolation: isolate;
        }

        .right-capsule::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 1.5px;
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.35) 0%,
                rgba(255, 255, 255, 0) 25%,
                rgba(255, 255, 255, 0) 75%,
                rgba(255, 255, 255, 0.25) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 5;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #ffffff;
            width: 34px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .icon-btn .pencil-plus {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .search-panel {
            position: absolute;
            top: 50px;
            left: 10px;
            right: 10px;
            padding: 4px;
            height: 44px;
        }

        .search-wrapper {
            width: 100%;
            height: 36px;
            background-color: #2b303c;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-placeholder {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #8fa2b2;
            font-size: 16px;
            pointer-events: none;
        }

        .categories-panel {
            position: absolute;
            top: 96px;
            left: 10px;
            right: 10px;
            padding: 4px;
            height: 44px;
        }

        .scroll-capsule {
            width: 100%;
            height: 36px;
            background-color: #2b303c;
            border-radius: 20px;
            padding: 3px 4px;
            display: flex;
            position: relative;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .scroll-capsule::-webkit-scrollbar {
            display: none;
        }

        .active-bg {
            position: absolute;
            top: 3px;
            bottom: 3px;
            left: 0;
            width: 0;
            background-color: #383e4c;
            border-radius: 16px;
            z-index: 1;
            pointer-events: none;
            transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1), width 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .tab-item {
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 16px;
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            position: relative;
            z-index: 2;
            cursor: pointer;
            transition: color 0.25s ease;
        }

        .tab-item:not(.active) {
            color: #a0a0a2;
        }

        .content-area {
            flex: 1;
            background-color: #1e1f26;
            position: relative;
            z-index: 5;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: #2b303c #1e1f26;
        }

        .content-area::-webkit-scrollbar {
            width: 4px;
        }

        .content-area::-webkit-scrollbar-track {
            background: #1e1f26;
        }

        .content-area::-webkit-scrollbar-thumb {
            background: #2b303c;
            border-radius: 2px;
        }

        .placeholder-text {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #8fa2b2;
            font-size: 18px;
        }

        .cards-grid {
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 12px;
            padding-top: 148px;
            padding-bottom: 100px;
        }

        .cards-grid.visible {
            display: grid;
        }

        .gift-card {
            background-color: #2b303c;
            border-radius: 20px;
            padding: 8px;
            box-sizing: border-box;
            transition: transform 0.1s ease;
            cursor: pointer;
            position: relative;
            isolation: isolate;
        }

        .gift-card:active {
            transform: scale(0.97);
        }

        .gift-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 1.5px;
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.35) 0%,
                rgba(255, 255, 255, 0) 25%,
                rgba(255, 255, 255, 0) 75%,
                rgba(255, 255, 255, 0.25) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 5;
        }

        .gift-card::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 19px;
            background: radial-gradient(circle at 50% 50%, rgba(43,48,60,0) 80%, #2b303c 100%);
            opacity: 0.7;
            pointer-events: none;
            z-index: 1;
        }

        .gift-card > * {
            position: relative;
            z-index: 2;
        }

        .image-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #8367f6;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><path d="M20 8c.6 0 1 .4 1 1v4c0 .6-.4 1-1 1s-1-.4-1-1V9c0-.6.4-1 1-1zm0 8c-2.2 0-4 1.8-4 4v12c0 1.1.9 2 2 2h4c1.1 0 2-.9 2-2V20c0-2.2-1.8-4-4-4zm0-13c0 1.1-.9 2-2 2s-1.5-1.5-.5-2.5C18 1.5 19 2 20 3z" fill="%23563dc6" fill-opacity="0.3"/></svg>');
            background-size: 54px;
            border-radius: 16px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .badge {
            position: absolute;
            top: 8px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 2;
        }

        .card-badge {
            left: 8px;
            background: rgba(255, 255, 255, 0.22);
        }

        .lucky-badge {
            left: 42px;
            background: rgba(43, 179, 114, 0.45);
        }

        .character-svg {
            width: 60%;
            height: auto;
            z-index: 1;
        }

        .info-container {
            margin-top: 10px;
            padding-left: 4px;
        }

        .title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 2px 0;
            letter-spacing: -0.2px;
        }

        .id-number {
            color: #8fa2b2;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: -0.1px;
        }

        .action-container {
            margin-top: 10px;
            display: flex;
            gap: 6px;
        }

        .buy-button {
            flex-grow: 1;
            height: 40px;
            background-color: #007aff;
            border: none;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .buy-button:active {
            opacity: 0.85;
        }

        .price {
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .cart-button {
            width: 40px;
            height: 40px;
            background-color: #383e4c;
            border: none;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .cart-button:active {
            background-color: #4a5162;
        }

        .icon {
            fill: #ffffff;
        }

        .nav-panel {
            position: absolute;
            bottom: 15px;
            left: 10px;
            right: 90px;
            display: flex;
            background-color: #2b303c;
            border-radius: 40px;
            padding: 6px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            align-items: center;
            z-index: 30;
            overflow: visible;
            box-sizing: border-box;
            justify-content: space-between;
            height: 77px;
            isolation: isolate;
        }

        .nav-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 40px;
            padding: 1.5px;
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.30) 0%,
                rgba(255, 255, 255, 0) 25%,
                rgba(255, 255, 255, 0) 75%,
                rgba(255, 255, 255, 0.20) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 5;
        }

        .nav-slider {
            position: absolute;
            top: 6px;
            height: 65px;
            background-color: #383e4c;
            border-radius: 35px;
            z-index: -1;
            will-change: transform, width, opacity;
            transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1),
                        width 0.28s cubic-bezier(0.25, 1, 0.5, 1),
                        opacity 0.25s ease;
            pointer-events: none;
            opacity: 1;
        }

        .nav-item {
            position: relative;
            display: block;
            flex: 1;
            height: 65px;
            color: #8fa2b2;
            text-decoration: none;
            cursor: pointer;
            border-radius: 35px;
            user-select: none;
            transition: color 0.2s ease;
            box-sizing: border-box;
            min-width: 0;
            z-index: 1;
        }

        .profile-button {
            position: absolute;
            bottom: 15px;
            right: 10px;
            width: 77px;
            height: 77px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 30;
            user-select: none;
            box-sizing: border-box;
            padding: 0;
            background-color: #383e4c;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            isolation: isolate;
        }

        .profile-button::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            padding: 1.5px;
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.30) 0%,
                rgba(255, 255, 255, 0) 25%,
                rgba(255, 255, 255, 0) 75%,
                rgba(255, 255, 255, 0.20) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 5;
        }

        .major-coin-button {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(to bottom, #ffd175 0%, #ff9743 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s ease, filter 0.2s ease;
            box-shadow:
                inset 0 4px 8px rgba(255, 255, 255, 0.4),
                inset 0 -4px 8px rgba(0, 0, 0, 0.2);
        }

        .profile-button.active .major-coin-button {
            box-shadow:
                0 0 0 3px #383e4c,
                0 0 0 6px #2f80ed,
                inset 0 4px 8px rgba(255, 255, 255, 0.4),
                inset 0 -4px 8px rgba(0, 0, 0, 0.2);
        }

        .major-coin-button:active {
            transform: scale(0.96);
            filter: brightness(0.95);
        }

        .major-coin-symbol {
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Helvetica Neue", Arial, sans-serif;
            font-size: 34px;
            font-weight: 700;
            line-height: 1;
            margin-top: 2px;
            text-shadow: 0px 1px 2px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-item svg {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 24px;
            display: block;
            will-change: fill, stroke;
        }

        .nav-item svg.home-icon {
            width: 28px;
            height: 28px;
            top: 7px;
        }
        .nav-item .cart-icon {
            width: 28px;
            height: 28px;
            top: 6px;
        }
        .nav-item .catalog-icon {
            width: 28px;
            height: 28px;
            top: 6px;
        }
        .nav-item svg.chat-icon {
            width: 28px;
            height: 28px;
            top: 6px;
        }

        .nav-item span {
            position: absolute;
            bottom: 13px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 11px;
            font-weight: 500;
            line-height: 1;
            display: block;
            white-space: nowrap;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Helvetica Neue", Arial, sans-serif;
        }

        .nav-item.active {
            color: #2f80ed;
        }

        .nav-item:not(.active) svg.home-icon {
            color: #8fa2b2;
        }
        .nav-item:not(.active) svg.home-icon path {
            fill: #8fa2b2;
        }
        .nav-item.active svg.home-icon {
            color: #2f80ed;
        }
        .nav-item.active svg.home-icon path {
            fill: #2f80ed;
        }

        .nav-item .cart-icon {
            color: #8fa2b2;
        }
        .nav-item .cart-icon path {
            stroke: #8fa2b2;
        }
        .nav-item.active .cart-icon {
            color: #2f80ed;
        }
        .nav-item.active .cart-icon path {
            stroke: #2f80ed;
        }

        .nav-item .catalog-icon {
            color: #8fa2b2;
        }
        .nav-item.active .catalog-icon {
            color: #2f80ed;
        }

        .nav-item:not(.active) svg.chat-icon {
            color: #8fa2b2;
        }
        .nav-item.active svg.chat-icon {
            color: #2f80ed;
        }
    </style>
</head>
<body>

<div class="chat-container">

    <div class="floating-panel edit-panel visible" id="editPanel">
        <button class="btn-edit">Изм.</button>
    </div>

    <div class="floating-panel title-panel visible" id="titlePanel">
        <h1 class="header-title">Shopnet</h1>
    </div>

    <div class="floating-panel buttons-panel visible" id="buttonsPanel">
        <div class="right-capsule">
            <button class="icon-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round">
                    <circle cx="12" cy="12" r="9"></circle>
                    <line x1="12" y1="8" x2="12" y2="16"></line>
                    <line x1="8" y1="12" x2="16" y2="12"></line>
                </svg>
            </button>
            <button class="icon-btn">
                <svg class="pencil-plus" viewBox="0 0 24 24">
                    <path d="M12 20h9" />
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                    <line x1="10" y1="12" x2="14" y2="8" />
                    <line x1="8" y1="14" x2="12" y2="10" />
                </svg>
            </button>
        </div>
    </div>

    <div class="floating-panel search-panel visible" id="searchPanel">
        <div class="search-wrapper">
            <div class="search-placeholder">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <span>Поиск</span>
            </div>
        </div>
    </div>

    <div class="floating-panel categories-panel visible" id="categoriesPanel">
        <div class="scroll-capsule" id="scrollCapsule">
            <div class="active-bg" id="activeBg"></div>
            <div class="tab-item active" onclick="setActiveCategory(this)">Все</div>
            <div class="tab-item" onclick="setActiveCategory(this)">My Chats</div>
            <div class="tab-item" onclick="setActiveCategory(this)">TON Devs</div>
            <div class="tab-item" onclick="setActiveCategory(this)">BotsCreators</div>
            <div class="tab-item" onclick="setActiveCategory(this)">Crypto</div>
            <div class="tab-item" onclick="setActiveCategory(this)">Lists</div>
            <div class="tab-item" onclick="setActiveCategory(this)">Contact</div>
            <div class="tab-item" onclick="setActiveCategory(this)">Jetton</div>
        </div>
    </div>

    <div class="content-area" id="contentArea">
        <div class="cards-grid visible" id="cardsGrid">
            <div class="gift-card">

    <div class="profile-button" id="profileButton" onclick="setActiveProfile(this)">
        <div class="major-coin-button">
            <span class="major-coin-symbol">I</span>
        </div>
    </div>
</div>

<script>
    (function() {
        async function initTelegramApp() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
                if (window.Telegram.WebApp.requestFullscreen) {
                    try { await window.Telegram.WebApp.requestFullscreen(); } catch (error) {}
                }
            }
        }
        window.addEventListener('DOMContentLoaded', initTelegramApp);

        const slider = document.getElementById('slider');
        const editPanel = document.getElementById('editPanel');
        const titlePanel = document.getElementById('titlePanel');
        const buttonsPanel = document.getElementById('buttonsPanel');
        const searchPanel = document.getElementById('searchPanel');
        const categoriesPanel = document.getElementById('categoriesPanel');
        const cardsGrid = document.getElementById('cardsGrid');
        const placeholderText = document.getElementById('placeholderText');
        let isProfileActive = false;

        function setActiveTab(element) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.getElementById('profileButton').classList.remove('active');
            element.classList.add('active');

            if (element.id === 'homeTab') {
                editPanel.classList.add('visible');
                titlePanel.classList.add('visible');
                buttonsPanel.classList.add('visible');
                searchPanel.classList.add('visible');
                categoriesPanel.classList.add('visible');
                cardsGrid.classList.add('visible');
                placeholderText.style.display = 'none';
            } else {
                editPanel.classList.remove('visible');
                titlePanel.classList.remove('visible');
                buttonsPanel.classList.remove('visible');
                searchPanel.classList.remove('visible');
                categoriesPanel.classList.remove('visible');
                cardsGrid.classList.remove('visible');
                placeholderText.style.display = 'flex';
                placeholderText.textContent = element.querySelector('span').textContent;
            }

            const parent = element.parentElement;
            const parentRect = parent.getBoundingClientRect();
            const elementRect = element.getBoundingClientRect();
            const offsetLeft = elementRect.left - parentRect.left;
            const padding = 6;
            const elementWidth = Math.round(elementRect.width);
            const sliderWidth = elementWidth - 4;
            const sliderOffset = Math.round(offsetLeft - padding + 2);

            if (isProfileActive) {
                slider.style.transition = 'none';
                slider.style.width = sliderWidth + 'px';
                slider.style.transform = 'translateX(' + sliderOffset + 'px)';
                void slider.offsetHeight;
                slider.style.transition = 'opacity 0.25s ease';
                slider.style.opacity = '1';
                isProfileActive = false;
            } else {
                slider.style.transition = 'transform 0.28s cubic-bezier(0.25, 1, 0.5, 1), width 0.28s cubic-bezier(0.25, 1, 0.5, 1)';
                slider.style.width = sliderWidth + 'px';
                slider.style.transform = 'translateX(' + sliderOffset + 'px)';
                slider.style.opacity = '1';
            }
        }

        function setActiveProfile(element) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            editPanel.classList.remove('visible');
            titlePanel.classList.remove('visible');
            buttonsPanel.classList.remove('visible');
            searchPanel.classList.remove('visible');
            categoriesPanel.classList.remove('visible');
            cardsGrid.classList.remove('visible');
            placeholderText.style.display = 'flex';
            placeholderText.textContent = 'Profile';
            slider.style.transition = 'opacity 0.25s ease';
            slider.style.opacity = '0';
            isProfileActive = true;
            element.classList.add('active');
        }

        const capsule = document.getElementById('scrollCapsule');
        const activeBg = document.getElementById('activeBg');
        const categoryTabs = document.querySelectorAll('.tab-item');

        function setActiveCategory(element) {
            categoryTabs.forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            moveSliderHeader(element);
            capsule.scrollTo({ left: (element.offsetLeft + element.offsetWidth / 2) - capsule.offsetWidth / 2, behavior: 'smooth' });
        }

        function moveSliderHeader(activeTab) {
            const capsuleRect = capsule.getBoundingClientRect();
            const tabRect = activeTab.getBoundingClientRect();
            const leftPosition = tabRect.left - capsuleRect.left + capsule.scrollLeft;
            activeBg.style.left = leftPosition + 'px';
            activeBg.style.width = tabRect.width + 'px';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const defaultActiveHeader = document.querySelector('.tab-item.active');
            activeBg.style.transition = 'none';
            moveSliderHeader(defaultActiveHeader);
            activeBg.offsetHeight;
            activeBg.style.transition = 'left 0.3s cubic-bezier(0.25, 1, 0.5, 1), width 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
            setActiveTab(document.getElementById('homeTab'));
        });

        window.addEventListener('resize', () => {
            const currentActiveHeader = document.querySelector('.tab-item.active');
            if (currentActiveHeader) moveSliderHeader(currentActiveHeader);
            const activeNavItem = document.querySelector('.nav-item.active');
            if (activeNavItem) {
                const parent = activeNavItem.parentElement;
                const parentRect = parent.getBoundingClientRect();
                const elementRect = activeNavItem.getBoundingClientRect();
                const offsetLeft = elementRect.left - parentRect.left;
                const padding = 6;
                const elementWidth = Math.round(elementRect.width);
                slider.style.width = (elementWidth - 4) + 'px';
                slider.style.transform = 'translateX(' + Math.round(offsetLeft - padding + 2) + 'px)';
            }
        });

        window.setActiveTab = setActiveTab;
        window.setActiveProfile = setActiveProfile;
        window.setActiveCategory = setActiveCategory;
    })();
</script>

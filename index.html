<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shopnet · Карточки с переворотом</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      background-color: #0c0d12;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    .chat-container {
      position: relative;
      width: 401px;
      height: 751px;
      background-color: #1C1C1E;
      border-radius: 0;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .floating-panel {
      background-color: transparent;
      border-radius: 0px;
      padding: 4px;
      user-select: none;
      z-index: 25;
      display: none;
      height: 44px;
      align-items: center;
      position: relative;
      isolation: isolate;
      border: none;
      outline: none;
    }

    .floating-panel.visible {
      display: flex;
    }

    .edit-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      min-width: 70px;
      justify-content: center;
    }

    .btn-edit {
      background-color: #2C2C2E;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 15px;
      font-weight: 400;
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title-panel {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 16px;
      justify-content: center;
      background-color: #2C2C2E;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      height: 36px;
      display: flex;
      align-items: center;
    }

    .header-title {
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
      line-height: 1;
    }

    .buttons-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      min-width: 80px;
      justify-content: center;
    }

    .right-capsule {
      display: flex;
      align-items: center;
      background-color: #2C2C2E;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 2px;
      height: 36px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #ffffff;
      width: 34px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .search-panel {
      position: absolute;
      top: 50px;
      left: 10px;
      right: 10px;
      padding: 4px;
      height: 44px;
      transform-origin: top center;
      will-change: transform, opacity;
      z-index: 26;
    }

    .search-wrapper {
      width: 100%;
      height: 36px;
      background-color: #2C2C2E;
      border: none;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .search-placeholder {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #8e8e93;
      font-size: 16px;
      pointer-events: none;
      white-space: nowrap;
    }

    .categories-panel {
      position: absolute;
      top: 96px;
      left: 10px;
      right: 10px;
      padding: 4px;
      height: 44px;
      will-change: transform;
      z-index: 24;
    }

    .scroll-capsule {
      width: 100%;
      height: 36px;
      background-color: #2C2C2E;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 3px 4px;
      display: flex;
      position: relative;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .scroll-capsule::-webkit-scrollbar {
      display: none;
    }

    .active-bg {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 0;
      width: 0;
      background-color: #464648;
      border-radius: 16px;
      z-index: 1;
      pointer-events: none;
      transition: left 0.35s cubic-bezier(0.25, 1, 0.5, 1), width 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .tab-item {
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      padding: 6px 16px;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      position: relative;
      z-index: 2;
      cursor: pointer;
      transition: color 0.25s ease;
      flex-shrink: 0;
    }

    .tab-item:not(.active) {
      color: #a0a0a2;
    }

    .content-area {
      flex: 1;
      background-color: #1C1C1E;
      position: relative;
      z-index: 5;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: #464648 #1C1C1E;
    }

    .content-area::-webkit-scrollbar {
      width: 4px;
    }
    .content-area::-webkit-scrollbar-track {
      background: #1C1C1E;
    }
    .content-area::-webkit-scrollbar-thumb {
      background: #464648;
      border-radius: 2px;
    }

    .placeholder-text {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #8e8e93;
      font-size: 18px;
    }

    .cards-grid {
      display: none;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      padding: 6px;
      padding-top: 148px;
      padding-bottom: 100px;
    }

    .cards-grid.visible {
      display: grid;
    }

    .gift-card {
      position: relative;
      width: 100%;
      perspective: 1400px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.34, 1.2, 0.64, 1);
    }

    .gift-card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      width: 100%;
      background-color: #2C2C2E;
      border-radius: 20px;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      isolation: isolate;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-front {
      position: relative;
    }

    .card-back {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      transform: rotateY(180deg);
      justify-content: space-between;
    }

    .card-face .static-bg {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      height: 60%;
      background-color: #464648;
      border-radius: 14px;
      z-index: 1;
      pointer-events: none;
    }

    .card-back .static-bg {
      display: none;
    }

    .card-face > * {
      position: relative;
      z-index: 2;
    }

    .back-dividers {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 5;
    }

    .back-dividers .divider {
      position: absolute;
      left: 8px;
      right: 8px;
      height: 1px;
      background-color: rgba(255, 255, 255, 0.08);
    }

    .back-dividers .divider:nth-child(1) { top: 20%; }
    .back-dividers .divider:nth-child(2) { top: 40%; }
    .back-dividers .divider:nth-child(3) { top: 60%; }
    .back-dividers .divider:nth-child(4) { top: 80%; }

    .image-container {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #464648;
      border-radius: 14px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .image-container.back-avatar {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 45px;
      height: 45px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background-color: #464648;
      flex: none;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      margin: 0;
    }

    .inner-circle {
      width: 39.6px;
      height: 39.6px;
      border-radius: 50%;
      background-color: #2C2C2E;
      z-index: 2;
    }

    .card-back .action-container {
      margin-top: auto;
      margin-bottom: 0;
    }

    .cart-icon-large {
      width: 50%;
      height: 50%;
      color: #8e8e93;
      z-index: 2;
    }

    .badge {
      position: absolute;
      top: 6px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 3;
      background: rgba(255, 255, 255, 0.22) !important;
      color: #ffffff;
    }

    .badge-heart { left: 6px; }
    .badge-cart { left: 36px; }
    .badge-send { left: 66px; }

    .badge-heart svg,
    .badge-cart svg,
    .badge-send svg {
      width: 14px;
      height: 14px;
      display: block;
      stroke: none;
    }

    .badge-heart svg {
      fill: #ffffff;
    }

    .badge-cart svg {
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .badge-send svg {
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .info-container {
      margin-top: 4px;
      padding-left: 4px;
      padding-bottom: 4px;
    }

    .title {
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 2px 0;
      letter-spacing: -0.2px;
    }

    .id-number {
      color: #8e8e93;
      font-size: 12px;
      font-weight: 500;
    }

    .action-container {
      margin-top: 4px;
      display: flex;
      gap: 4px;
    }

    .buy-button {
      flex-grow: 1;
      height: 34px;
      background-color: #007aff;
      border: none;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }

    .buy-button:active {
      opacity: 0.85;
    }

    .price {
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
    }

    .cart-button {
      width: 34px;
      height: 34px;
      background-color: #464648;
      border: none;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .cart-button:active {
      background-color: #5a5a5c;
    }

    .cart-button svg {
      width: 18px;
      height: 18px;
      display: block;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon {
      fill: #ffffff;
    }

    .nav-panel {
      position: absolute;
      bottom: 15px;
      left: 10px;
      right: 90px;
      display: flex;
      background-color: rgba(44, 44, 46, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 40px;
      padding: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      align-items: stretch;
      z-index: 30;
      overflow: visible;
      box-sizing: border-box;
      justify-content: space-between;
      height: 77px;
      isolation: isolate;
    }

    .nav-slider {
      position: absolute;
      top: 6px;
      bottom: 6px;
      height: auto;
      background-color: rgba(70, 70, 72, 0.9);
      border-radius: 35px;
      z-index: -1;
      will-change: transform;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.2s ease;
      pointer-events: none;
      opacity: 1;
    }

    .nav-item {
      position: relative;
      display: block;
      flex: 1;
      height: 100%;
      color: #8e8e93;
      text-decoration: none;
      cursor: pointer;
      border-radius: 35px;
      user-select: none;
      transition: color 0.2s ease;
      box-sizing: border-box;
      min-width: 0;
      z-index: 1;
    }

    .profile-button {
      position: absolute;
      bottom: 15px;
      right: 10px;
      width: 77px;
      height: 77px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 30;
      user-select: none;
      box-sizing: border-box;
      padding: 0;
      background-color: rgba(44, 44, 46, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .major-coin-button {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: linear-gradient(to bottom, #ffd175 0%, #ff9743 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: box-shadow 0.28s cubic-bezier(0.25, 1, 0.5, 1);
      box-shadow:
        0 0 0 0 rgba(44, 44, 46, 0),
        0 0 0 0 rgba(47, 128, 237, 0),
        inset 0 -4px 8px rgba(0, 0, 0, 0.2);
    }

    .profile-button.active .major-coin-button {
      box-shadow:
        0 0 0 3px rgba(44, 44, 46, 1),
        0 0 0 6px rgba(47, 128, 237, 1),
        inset 0 -4px 8px rgba(0, 0, 0, 0.2);
    }

    .major-coin-symbol {
      color: #ffffff;
      font-size: 34px;
      font-weight: 700;
      line-height: 1;
      text-shadow: 0px 1px 2px rgba(0,0,0,0.1);
    }

    .nav-item svg {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 24px;
    }
    .nav-item svg.home-icon { width: 28px; height: 28px; top: 7px; }
    .nav-item .cart-icon { width: 28px; height: 28px; top: 6px; }
    .nav-item .catalog-icon { width: 28px; height: 28px; top: 6px; }
    .nav-item svg.chat-icon { width: 28px; height: 28px; top: 6px; }

    .nav-item span {
      position: absolute;
      bottom: 13px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
      display: block;
      white-space: nowrap;
    }

    .nav-item.active {
      color: #2f80ed;
    }
    .nav-item:not(.active) svg.home-icon path { fill: #8e8e93; }
    .nav-item.active svg.home-icon path { fill: #2f80ed; }
    .nav-item .cart-icon path { stroke: #8e8e93; }
    .nav-item.active .cart-icon path { stroke: #2f80ed; }
    .nav-item .catalog-icon { color: #8e8e93; }
    .nav-item.active .catalog-icon { color: #2f80ed; }
    .nav-item:not(.active) svg.chat-icon { color: #8e8e93; }
    .nav-item.active svg.chat-icon { color: #2f80ed; }
  </style>
</head>
<body>
<div class="chat-container">
  <div class="floating-panel edit-panel visible" id="editPanel"><button class="btn-edit">Изм.</button></div>
  <div class="floating-panel title-panel visible" id="titlePanel"><h1 class="header-title">Shopnet</h1></div>
  <div class="floating-panel buttons-panel visible" id="buttonsPanel">
    <div class="right-capsule">
      <button class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></button>
      <button class="icon-btn"><svg class="pencil-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/><line x1="10" y1="12" x2="14" y2="8"/><line x1="8" y1="14" x2="12" y2="10"/></svg></button>
    </div>
  </div>

  <div class="floating-panel search-panel visible" id="searchPanel">
    <div class="search-wrapper"><div class="search-placeholder"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>Поиск</span></div></div>
  </div>

  <div class="floating-panel categories-panel visible" id="categoriesPanel">
    <div class="scroll-capsule" id="scrollCapsule">
      <div class="active-bg" id="activeBg"></div>
      <div class="tab-item active" onclick="setActiveCategory(this)">Все</div>
      <div class="tab-item" onclick="setActiveCategory(this)">My Chats</div>
      <div class="tab-item" onclick="setActiveCategory(this)">TON Devs</div>
      <div class="tab-item" onclick="setActiveCategory(this)">BotsCreators</div>
      <div class="tab-item" onclick="setActiveCategory(this)">Crypto</div>
      <div class="tab-item" onclick="setActiveCategory(this)">Lists</div>
      <div class="tab-item" onclick="setActiveCategory(this)">Contact</div>
      <div class="tab-item" onclick="setActiveCategory(this)">Jetton</div>
    </div>
  </div>

  <div class="content-area" id="contentArea">
    <div class="cards-grid visible" id="cardsGrid">
      <!-- карточка 1 -->
      <div class="gift-card">
        <div class="card-inner">
          <div class="card-face card-front">
            <div class="static-bg"></div>
            <div class="image-container">

      <svg class="chat-icon" viewBox="0 0 32 32"><path fill="currentColor" d="M2 13.5C2 7.701 6.701 3 12.5 3S23 7.701 23 13.5S18.3 24 12.5 24c-1.686 0-3.281-.398-4.695-1.106L3.89 23.943a1.5 1.5 0 0 1-1.837-1.837l1.05-3.918A10.4 10.4 0 0 1 2 13.5m10.5 12q1-.001 1.955-.158A8.46 8.46 0 0 0 19.5 27c1.486 0 2.88-.38 4.094-1.049a1 1 0 0 1 .741-.09l3.456.926l-.926-3.458a1 1 0 0 1 .09-.74A8.46 8.46 0 0 0 28 18.5a8.49 8.49 0 0 0-3.665-6.991a12 12 0 0 0-.787-2.7A10.5 10.5 0 0 1 30 18.5a10.5 10.5 0 0 1-1.102 4.688l1.05 3.918a1.5 1.5 0 0 1-1.838 1.837l-3.915-1.049A10.46 10.46 0 0 1 19.5 29c-3.124 0-5.93-1.364-7.853-3.53q.423.03.853.03"/></svg>
      <span>Messages</span>
    </div>
  </div>

  <div class="profile-button" id="profileButton" onclick="setActiveProfile(this)">
    <div class="major-coin-button">
      <span class="major-coin-symbol">I</span>
    </div>
  </div>
</div>

<script>
  (function() {
    async function initTelegramApp() {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        if (window.Telegram.WebApp.requestFullscreen) {
          try { await window.Telegram.WebApp.requestFullscreen(); } catch (error) {}
        }
      }
    }
    window.addEventListener('DOMContentLoaded', initTelegramApp);

    const slider = document.getElementById('slider');
    const editPanel = document.getElementById('editPanel');
    const titlePanel = document.getElementById('titlePanel');
    const buttonsPanel = document.getElementById('buttonsPanel');
    const searchPanel = document.getElementById('searchPanel');
    const categoriesPanel = document.getElementById('categoriesPanel');
    const cardsGrid = document.getElementById('cardsGrid');
    const placeholderText = document.getElementById('placeholderText');
    const contentArea = document.getElementById('contentArea');
    let isProfileActive = false;

    const SEARCH_TOP = 50;
    const CATEGORIES_TOP = 96;
    const CATEGORIES_RISE_DISTANCE = CATEGORIES_TOP - SEARCH_TOP;
    const SCROLL_THRESHOLD = 60;
    let ticking = false;

    function handleContentScroll() {
      if (!document.getElementById('homeTab').classList.contains('active')) return;

      const scrollTop = contentArea.scrollTop;
      const progress = Math.min(scrollTop / SCROLL_THRESHOLD, 1);

      const searchScaleY = 1 - progress;
      const searchOpacity = 1 - progress;
      const categoriesRise = -progress * CATEGORIES_RISE_DISTANCE;

      searchPanel.style.transform = `scaleY(${searchScaleY})`;
      searchPanel.style.opacity = searchOpacity;

      categoriesPanel.style.transform = `translateY(${categoriesRise}px)`;
    }

    contentArea.addEventListener('scroll', () => {
      if (!ticking) {
        window.requestAnimationFrame(() => {
          handleContentScroll();
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: true });

    function resetScrollAnimation() {
      contentArea.scrollTop = 0;
      searchPanel.style.transform = 'scaleY(1)';
      searchPanel.style.opacity = '1';
      categoriesPanel.style.transform = 'translateY(0)';
    }

    function setActiveTab(element, index) {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      document.getElementById('profileButton').classList.remove('active');
      element.classList.add('active');

      if (element.id === 'homeTab') {
        editPanel.classList.add('visible');
        titlePanel.classList.add('visible');
        buttonsPanel.classList.add('visible');
        searchPanel.classList.add('visible');
        categoriesPanel.classList.add('visible');
        cardsGrid.classList.add('visible');
        placeholderText.style.display = 'none';
        resetScrollAnimation();
      } else {
        editPanel.classList.remove('visible');
        titlePanel.classList.remove('visible');
        buttonsPanel.classList.remove('visible');
        searchPanel.classList.remove('visible');
        categoriesPanel.classList.remove('visible');
        cardsGrid.classList.remove('visible');
        placeholderText.style.display = 'flex';
        placeholderText.textContent = element.querySelector('span').textContent;
        resetScrollAnimation();
      }

      const parent = element.parentElement;
      const parentRect = parent.getBoundingClientRect();
      const elementRect = element.getBoundingClientRect();
      const offsetLeft = elementRect.left - parentRect.left;
      const padding = 6;
      const elementWidth = Math.round(elementRect.width);
      const sliderWidth = elementWidth - 4;
      const sliderOffset = Math.round(offsetLeft - padding + 2);

      if (isProfileActive) {
        slider.style.transition = 'none';
        slider.style.width = sliderWidth + 'px';
        slider.style.transform = 'translateX(' + sliderOffset + 'px)';
        void slider.offsetHeight;
        slider.style.transition = 'opacity 0.2s ease';
        slider.style.opacity = '1';
        isProfileActive = false;
      } else {
        slider.style.transition = 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), width 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.2s ease';
        slider.style.width = sliderWidth + 'px';
        slider.style.transform = 'translateX(' + sliderOffset + 'px)';
        slider.style.opacity = '1';
      }
    }

    function setActiveProfile(element) {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      editPanel.classList.remove('visible');
      titlePanel.classList.remove('visible');
      buttonsPanel.classList.remove('visible');
      searchPanel.classList.remove('visible');
      categoriesPanel.classList.remove('visible');
      cardsGrid.classList.remove('visible');
      placeholderText.style.display = 'flex';
      placeholderText.textContent = 'Profile';
      slider.style.transition = 'opacity 0.2s ease';
      slider.style.opacity = '0';
      isProfileActive = true;
      element.classList.add('active');
      resetScrollAnimation();
    }

    const capsule = document.getElementById('scrollCapsule');
    const activeBg = document.getElementById('activeBg');
    const categoryTabs = document.querySelectorAll('.tab-item');

    function setActiveCategory(element) {
      categoryTabs.forEach(t => t.classList.remove('active'));
      element.classList.add('active');
      moveSliderHeader(element);
      capsule.scrollTo({ left: (element.offsetLeft + element.offsetWidth / 2) - capsule.offsetWidth / 2, behavior: 'smooth' });
    }

    function moveSliderHeader(activeTab) {
      const capsuleRect = capsule.getBoundingClientRect();
      const tabRect = activeTab.getBoundingClientRect();
      const leftPosition = tabRect.left - capsuleRect.left + capsule.scrollLeft;
      activeBg.style.left = leftPosition + 'px';
      activeBg.style.width = tabRect.width + 'px';
    }

    window.addEventListener('DOMContentLoaded', () => {
      const defaultActiveHeader = document.querySelector('.tab-item.active');
      activeBg.style.transition = 'none';
      moveSliderHeader(defaultActiveHeader);
      activeBg.offsetHeight;
      activeBg.style.transition = 'left 0.35s cubic-bezier(0.25, 1, 0.5, 1), width 0.35s cubic-bezier(0.25, 1, 0.5, 1)';
      setActiveTab(document.getElementById('homeTab'), 0);
    });

    window.addEventListener('resize', () => {
      const currentActiveHeader = document.querySelector('.tab-item.active');
      if (currentActiveHeader) moveSliderHeader(currentActiveHeader);
      const activeNavItem = document.querySelector('.nav-item.active');
      if (activeNavItem) {
        const parent = activeNavItem.parentElement;
        const parentRect = parent.getBoundingClientRect();
        const elementRect = activeNavItem.getBoundingClientRect();
        const offsetLeft = elementRect.left - parentRect.left;
        const padding = 6;
        const elementWidth = Math.round(elementRect.width);
        slider.style.width = (elementWidth - 4) + 'px';
        slider.style.transform = 'translateX(' + Math.round(offsetLeft - padding + 2) + 'px)';
      }
    });

    window.flipCard = function(button) {
      var card = button.closest('.gift-card');
      if (card) {
        card.classList.toggle('flipped');
      }
    };

    window.setActiveTab = setActiveTab;
    window.setActiveProfile = setActiveProfile;
    window.setActiveCategory = setActiveCategory;
  })();
</script>
</body>
</html>

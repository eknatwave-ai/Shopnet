<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shopnet · Иконка корзины в карточках</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      background-color: #0c0d12;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    .chat-container {
      position: relative;
      width: 401px;
      height: 751px;
      background-color: #1e1f26;
      border-radius: 0;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* === ВЕРХНИЕ ПАНЕЛИ === */
    .floating-panel {
      background-color: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border-radius: 0px;
      padding: 4px;
      user-select: none;
      z-index: 25;
      display: none;
      box-shadow: none;
      height: 44px;
      align-items: center;
      position: relative;
      isolation: isolate;
      border: none;
      outline: none;
    }

    .floating-panel.visible {
      display: flex;
    }

    .edit-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      min-width: 70px;
      justify-content: center;
    }

    .btn-edit {
      background-color: #2b303c;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 15px;
      font-weight: 400;
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      isolation: isolate;
    }

    .title-panel {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 16px;
      justify-content: center;
      background-color: #2b303c;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      height: 36px;
      display: flex;
      align-items: center;
      isolation: isolate;
    }

    .header-title {
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
      line-height: 1;
    }

    .buttons-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      min-width: 80px;
      justify-content: center;
    }

    .right-capsule {
      display: flex;
      align-items: center;
      background-color: #2b303c;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 2px;
      height: 36px;
      position: relative;
      isolation: isolate;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #ffffff;
      width: 34px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .search-panel {
      position: absolute;
      top: 50px;
      left: 10px;
      right: 10px;
      padding: 4px;
      height: 44px;
    }

    .search-wrapper {
      width: 100%;
      height: 36px;
      background-color: #2b303c;
      border: none;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-placeholder {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #8fa2b2;
      font-size: 16px;
      pointer-events: none;
    }

    .categories-panel {
      position: absolute;
      top: 96px;
      left: 10px;
      right: 10px;
      padding: 4px;
      height: 44px;
    }

    .scroll-capsule {
      width: 100%;
      height: 36px;
      background-color: #2b303c;
      border: none;
      border-radius: 20px;
      padding: 3px 4px;
      display: flex;
      position: relative;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .scroll-capsule::-webkit-scrollbar {
      display: none;
    }

    .active-bg {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 0;
      width: 0;
      background-color: #383e4c;
      border-radius: 16px;
      z-index: 1;
      pointer-events: none;
      transition: left 0.35s cubic-bezier(0.25, 1, 0.5, 1), width 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .tab-item {
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      padding: 6px 16px;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      position: relative;
      z-index: 2;
      cursor: pointer;
      transition: color 0.25s ease;
    }

    .tab-item:not(.active) {
      color: #a0a0a2;
    }

    .content-area {
      flex: 1;
      background-color: #1e1f26;
      position: relative;
      z-index: 5;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: #2b303c #1e1f26;
    }

    .content-area::-webkit-scrollbar {
      width: 4px;
    }
    .content-area::-webkit-scrollbar-track {
      background: #1e1f26;
    }
    .content-area::-webkit-scrollbar-thumb {
      background: #2b303c;
      border-radius: 2px;
    }

    .placeholder-text {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #8fa2b2;
      font-size: 18px;
    }

    /* === СЕТКА КАРТОЧЕК === */
    .cards-grid {
      display: none;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 12px;
      padding-top: 148px;
      padding-bottom: 100px;
    }

    .cards-grid.visible {
      display: grid;
    }

    /* КАРТОЧКА С ТУСКЛОЙ ОБВОДКОЙ */
    .gift-card {
      background-color: #2b303c;
      border-radius: 20px;
      padding: 8px;
      box-sizing: border-box;
      transition: transform 0.1s ease;
      cursor: pointer;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 210px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .gift-card:active {
      transform: scale(0.97);
    }

    /* Внутренняя подложка */
    .gift-card .static-bg {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      height: 60%;
      background-color: #22252d;
      border-radius: 14px;
      z-index: 1;
      pointer-events: none;
    }

    /* Контент поверх */
    .gift-card > * {
      position: relative;
      z-index: 2;
    }

    /* Контейнер для иконки корзины */
    .image-container {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #2b2b2b;
      background-image: none;
      border-radius: 14px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin-bottom: 6px;
    }

    /* Иконка корзины в карточке */
    .cart-icon-large {
      width: 50%;
      height: 50%;
      fill: none;
      stroke: #8fa2b2;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      z-index: 2;
    }

    .badge {
      position: absolute;
      top: 6px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 3;
    }

    .card-badge {
      left: 6px;
      background: rgba(255, 255, 255, 0.22);
    }

    .lucky-badge {
      left: 36px;
      background: rgba(43, 179, 114, 0.45);
    }

    .info-container {
      margin-top: 4px;
      padding-left: 4px;
      padding-bottom: 4px;
    }

    .title {
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 2px 0;
      letter-spacing: -0.2px;
    }

    .id-number {
      color: #8fa2b2;
      font-size: 12px;
      font-weight: 500;
    }

    .action-container {
      margin-top: 4px;
      display: flex;
      gap: 4px;
    }

    .buy-button {
      flex-grow: 1;
      height: 34px;
      background-color: #007aff;
      border: none;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }

    .buy-button:active {
      opacity: 0.85;
    }

    .price {
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
    }

    .cart-button {
      width: 34px;
      height: 34px;
      background-color: #383e4c;
      border: none;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .cart-button:active {
      background-color: #4a5162;
    }

    .icon {
      fill: #ffffff;
    }

    /* === НИЖНЯЯ ПАНЕЛЬ — ПРОЗРАЧНЕЕ === */
    .nav-panel {
      position: absolute;
      bottom: 15px;
      left: 10px;
      right: 90px;
      display: flex;
      background-color: rgba(43, 48, 60, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 40px;
      padding: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      align-items: center;
      z-index: 30;
      overflow: visible;
      box-sizing: border-box;
      justify-content: space-between;
      height: 77px;
      isolation: isolate;
    }

    .nav-slider {
      position: absolute;
      top: 6px;
      height: 65px;
      width: calc((100% - 12px) / 4);
      background-color: rgba(56, 62, 76, 0.85);
      border-radius: 35px;
      z-index: -1;
      will-change: transform;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.25s ease;
      pointer-events: none;
      opacity: 1;
    }

    .nav-item {
      position: relative;
      display: block;
      flex: 1;
      height: 65px;
      color: #8fa2b2;
      text-decoration: none;
      cursor: pointer;
      border-radius: 35px;
      user-select: none;
      transition: color 0.2s ease;
      box-sizing: border-box;
      min-width: 0;
      z-index: 1;
    }

    .profile-button {
      position: absolute;
      bottom: 15px;
      right: 10px;
      width: 77px;
      height: 77px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 30;
      user-select: none;
      box-sizing: border-box;
      padding: 0;
      background-color: rgba(56, 62, 76, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      isolation: isolate;
    }

    .major-coin-button {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: linear-gradient(to bottom, #ffd175 0%, #ff9743 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s ease, filter 0.2s ease;
      box-shadow: inset 0 4px 8px rgba(255,255,255,0.4), inset 0 -4px 8px rgba(0,0,0,0.2);
    }

    .major-coin-symbol {
      color: #ffffff;
      font-size: 34px;
      font-weight: 700;
      line-height: 1;
      text-shadow: 0px 1px 2px rgba(0,0,0,0.1);
    }

    .nav-item svg {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 24px;
    }
    .nav-item svg.home-icon { width: 28px; height: 28px; top: 7px; }
    .nav-item .cart-icon { width: 28px; height: 28px; top: 6px; }
    .nav-item .catalog-icon { width: 28px; height: 28px; top: 6px; }
    .nav-item svg.chat-icon { width: 28px; height: 28px; top: 6px; }

    .nav-item span {
      position: absolute;
      bottom: 13px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
      display: block;
      white-space: nowrap;
    }

    .nav-item.active {
      color: #2f80ed;
    }
    .nav-item:not(.active) svg.home-icon path { fill: #8fa2b2; }
    .nav-item.active svg.home-icon path { fill: #2f80ed; }
    .nav-item .cart-icon path { stroke: #8fa2b2; }
    .nav-item.active .cart-icon path { stroke: #2f80ed; }
    .nav-item .catalog-icon { color: #8fa2b2; }
    .nav-item.active .catalog-icon { color: #2f80ed; }
    .nav-item:not(.active) svg.chat-icon { color: #8fa2b2; }
    .nav-item.active svg.chat-icon { color: #2f80ed; }
  </style>
</head>
<body>
<div class="chat-container">
  <!-- Верхние панели -->
  <div class="floating-panel edit-panel visible" id="editPanel"><button class="btn-edit">Изм.</button></div>
  <div class="floating-panel title-panel visible" id="titlePanel"><h1 class="header-title">Shopnet</h1></div>
  <div class="floating-panel buttons-panel visible" id="buttonsPanel">
    <div class="right-capsule">
      <button class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></button>
      <button class="icon-btn"><svg class="pencil-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/><line x1="10" y1="12" x2="14" y2="8"/><line x1="8" y1="14" x2="12" y2="10"/></svg></button>
    </div>
  </div>

  <!-- Поиск без обводки -->
  <div class="floating-panel search-panel visible" id="searchPanel">
    <div class="search-wrapper"><div class="search-placeholder"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>Поиск</span></div></div>
  </div>

  <!-- Категории без обводки -->
  <div class="floating-panel categories-panel visible" id="categoriesPanel">
    <div class="scroll-capsule" id="scrollCapsule">
      <div class="active-bg" id="activeBg"></div>
      <div class="tab-item active" onclick="setActiveCategory(this)">Все</div>
      <div class="tab-item" onclick="setActiveCategory(this)">My Chats</div>
      <div class="tab-item" onclick="setActiveCategory(this)">TON Devs</div>
      <div class="tab-item" onclick="setActiveCategory(this)">BotsCreators</div>
      <div class="tab-item" onclick="setActiveCategory(this)">Crypto</div>
      <div class="tab-item" onclick="setActiveCategory(this)">Lists</div>
      <div class="tab-item" onclick="setActiveCategory(this)">Contact</div>
      <div class="tab-item" onclick="setActiveCategory(this)">Jetton</div>
    </div>
  </div>

  <!-- Контент -->
  <div class="content-area" id="contentArea">
    <div class="cards-grid visible" id="cardsGrid">
      <!-- Карточка 1: Snoop Dogg -->
      <div class="gift-card">
        <div class="static-bg"></div>
        <div class="image-container">
          <svg class="cart-icon-large" viewBox="0 0 24 24">
            <path d="M2.5 8.5h19l-1.164 6.986c-.4 2.395-.599 3.592-1.438 4.303-.84.711-2.053.711-4.48.711H9.582c-2.428 0-3.642 0-4.48-.71-.84-.712-1.04-1.91-1.439-4.304z"/>

          </svg>
          <div class="badge card-badge"><svg class="icon" width="14" height="14" viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg></div>
          <div class="badge lucky-badge"><svg class="icon" width="14" height="14" viewBox="0 0 24 24"><path d="M12 2C9.24 2 7 4.24 7 7c0 1.31.53 2.5 1.38 3.38C7.5 11.23 7 12.56 7 14c0 2.76 2.24 5 5 5s5-2.24 5-5c0-1.44-.5-2.77-1.38-3.63.85-.88 1.38-2.07 1.38-3.37 0-2.76-2.24-5-5-5z"/></svg></div>
        </div>
        <div class="info-container"><h3 class="title">Snoop Dogg</h3><span class="id-number">#557730</span></div>
        <div class="action-container"><button class="buy-button"><span class="price">8.97</span><svg class="icon" width="14" height="14" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 4.25L18.4 19H5.6L12 6.25z"/></svg></button><button class="cart-button"><svg class="icon" width="16" height="16" viewBox="0 0 24 24"><path d="M17.21 9l-4.38-6.56c-.19-.28-.51-.42-.83-.42-.32 0-.64.14-.83.43L6.79 9H2c-.55 0-1 .45-1 1 0 .09.01.18.04.27l2.54 9.27c.23.84 1 1.46 1.87 1.46h13.1c.87 0 1.64-.62 1.87-1.46l2.54-9.27L23 10c0-.55-.45-1-1-1h-4.79zM9 9l3-4.5L15 9H9zm8.12 10H6.88l-1.91-7h14.06l-1.91 7z"/></svg></button></div>

      <!-- Карточка 2: Pikachu -->
      <div class="gift-card">
        <div class="static-bg"></div>
        <div class="image-container">
          <svg class="cart-icon-large" viewBox="0 0 24 24">
            <path d="M2.5 8.5h19l-1.164 6.986c-.4 2.395-.599 3.592-1.438 4.303-.84.711-2.053.711-4.48.711H9.582c-2.428 0-3.642 0-4.48-.71-.84-.712-1.04-1.91-1.439-4.304z"/>

          <div class="badge card-badge"><svg class="icon" width="14" height="14" viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg></div>

      </div>
      <!-- Карточка 3: Alien -->
      <div class="gift-card">
        <div class="static-bg"></div>
        <div class="image-container">
          <svg class="cart-icon-large" viewBox="0 0 24 24">
            <path d="M2.5 8.5h19l-1.164 6.986c-.4 2.395-.599 3.592-1.438 4.303-.84.711-2.053.711-4.48.711H9.582c-2.428 0-3.642 0-4.48-.71-.84-.712-1.04-1.91-1.439-4.304z"/>
            <path d="M12 12.5v4m4-4v4m-8-4v4M21 8.5H3m16.5 0l-3-5m-9 5l3-5"/>
          </svg>
          <div class="badge card-badge"><svg class="icon" width="14" height="14" viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg></div>

        window.Telegram.WebApp.expand();
        if (window.Telegram.WebApp.requestFullscreen) {
          try { await window.Telegram.WebApp.requestFullscreen(); } catch (error) {}
        }
      }
    }
    window.addEventListener('DOMContentLoaded', initTelegramApp);

    const slider = document.getElementById('slider');
    const editPanel = document.getElementById('editPanel');
    const titlePanel = document.getElementById('titlePanel');
    const buttonsPanel = document.getElementById('buttonsPanel');
    const searchPanel = document.getElementById('searchPanel');
    const categoriesPanel = document.getElementById('categoriesPanel');
    const cardsGrid = document.getElementById('cardsGrid');
    const placeholderText = document.getElementById('placeholderText');
    let isProfileActive = false;

    function setActiveTab(element, index) {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      document.getElementById('profileButton').classList.remove('active');
      element.classList.add('active');

      if (element.id === 'homeTab') {
        editPanel.classList.add('visible');
        titlePanel.classList.add('visible');
        buttonsPanel.classList.add('visible');
        searchPanel.classList.add('visible');
        categoriesPanel.classList.add('visible');
        cardsGrid.classList.add('visible');
        placeholderText.style.display = 'none';
      } else {
        editPanel.classList.remove('visible');
        titlePanel.classList.remove('visible');
        buttonsPanel.classList.remove('visible');
        searchPanel.classList.remove('visible');
        categoriesPanel.classList.remove('visible');
        cardsGrid.classList.remove('visible');
        placeholderText.style.display = 'flex';
        placeholderText.textContent = element.querySelector('span').textContent;
      }

      const parentWidth = slider.parentElement.offsetWidth - 12;
      const itemWidth = parentWidth / 4;
      const offset = index * itemWidth;

      if (isProfileActive) {
        slider.style.transition = 'none';
        slider.style.transform = 'translateX(' + offset + 'px)';
        void slider.offsetHeight;
        slider.style.transition = 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.25s ease';
        slider.style.opacity = '1';
        isProfileActive = false;
      } else {
        slider.style.transition = 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1)';
        slider.style.transform = 'translateX(' + offset + 'px)';
        slider.style.opacity = '1';
      }
    }

    function setActiveProfile(element) {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      editPanel.classList.remove('visible');
      titlePanel.classList.remove('visible');
      buttonsPanel.classList.remove('visible');
      searchPanel.classList.remove('visible');
      categoriesPanel.classList.remove('visible');
      cardsGrid.classList.remove('visible');
      placeholderText.style.display = 'flex';
      placeholderText.textContent = 'Profile';
      slider.style.transition = 'opacity 0.25s ease';
      slider.style.opacity = '0';
      isProfileActive = true;
      element.classList.add('active');
    }

    const capsule = document.getElementById('scrollCapsule');
    const activeBg = document.getElementById('activeBg');
    const categoryTabs = document.querySelectorAll('.tab-item');

    function setActiveCategory(element) {
      categoryTabs.forEach(t => t.classList.remove('active'));
      element.classList.add('active');
      moveSliderHeader(element);
      capsule.scrollTo({ left: (element.offsetLeft + element.offsetWidth / 2) - capsule.offsetWidth / 2, behavior: 'smooth' });
    }

    function moveSliderHeader(activeTab) {
      const capsuleRect = capsule.getBoundingClientRect();
      const tabRect = activeTab.getBoundingClientRect();
      const leftPosition = tabRect.left - capsuleRect.left + capsule.scrollLeft;
      activeBg.style.left = leftPosition + 'px';
      activeBg.style.width = tabRect.width + 'px';
    }

    window.addEventListener('DOMContentLoaded', () => {
      const defaultActiveHeader = document.querySelector('.tab-item.active');
      activeBg.style.transition = 'none';
      moveSliderHeader(defaultActiveHeader);
      activeBg.offsetHeight;
      activeBg.style.transition = 'left 0.35s cubic-bezier(0.25, 1, 0.5, 1), width 0.35s cubic-bezier(0.25, 1, 0.5, 1)';

      const sliderElement = document.getElementById('slider');
      const parentWidth = sliderElement.parentElement.offsetWidth - 12;
      const itemWidth = parentWidth / 4;
      sliderElement.style.width = itemWidth + 'px';
      sliderElement.style.transform = 'translateX(0px)';

      setActiveTab(document.getElementById('homeTab'), 0);
    });

    window.addEventListener('resize', () => {
      const currentActiveHeader = document.querySelector('.tab-item.active');
      if (currentActiveHeader) moveSliderHeader(currentActiveHeader);

      const parentWidth = slider.parentElement.offsetWidth - 12;
      const itemWidth = parentWidth / 4;
      slider.style.width = itemWidth + 'px';

      const activeNavItem = document.querySelector('.nav-item.active');
      if (activeNavItem) {
        const index = Array.from(activeNavItem.parentElement.children).filter(el => el.classList.contains('nav-item')).indexOf(activeNavItem);
        if (index !== -1) {
          slider.style.transform = 'translateX(' + (index * itemWidth) + 'px)';
        }
      }
    });

    window.setActiveTab = setActiveTab;
    window.setActiveProfile = setActiveProfile;
    window.setActiveCategory = setActiveCategory;
  })();
</script>
</body>
</html>
